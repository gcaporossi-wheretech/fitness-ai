name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # Backend Services (Matrix: auth, workouts, ai, analytics)
  # ==========================================
  backend-lint:
    name: "Backend: Lint (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, workouts, ai, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install ruff
      - name: Ruff lint
        run: cd services/${{ matrix.service }} && ruff check .
      - name: Ruff format check
        run: cd services/${{ matrix.service }} && ruff format --check .

  backend-test:
    name: "Backend: Tests (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, workouts, ai, analytics]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fitness_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/fitness_ai_test
          JWT_SECRET: test-secret-min-32-characters-long
          ANTHROPIC_API_KEY: test-key-not-real
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd services/${{ matrix.service }}
          pytest --cov=app --cov-report=xml --cov-report=term-missing -v

  backend-security:
    name: "Backend: Security (${{ matrix.service }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, workouts, ai, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install bandit
      - name: SAST scan with Bandit
        run: cd services/${{ matrix.service }} && bandit -r app/ -f json -o bandit-report.json || true
      - name: Check for high severity issues
        run: |
          cd services/${{ matrix.service }}
          bandit -r app/ -ll -ii

  # ==========================================
  # Secret Detection (whole repo)
  # ==========================================
  secret-detection:
    name: "Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # Dashboard (Next.js / TypeScript)
  # ==========================================
  dashboard-lint:
    name: "Dashboard: Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd web && npm ci
      - name: Type check
        run: cd web && npx tsc --noEmit
      - name: Lint
        run: cd web && npx eslint .

  dashboard-test:
    name: "Dashboard: Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: cd web && npm ci
      - name: Run tests
        run: cd web && npm test -- --coverage --watchAll=false

  # ==========================================
  # Docker Build (only on main)
  # ==========================================
  docker-build:
    name: "Docker: Build Images"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-lint, backend-test, backend-security, secret-detection, dashboard-lint, dashboard-test]
    strategy:
      matrix:
        service: [auth, workouts, ai, analytics]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -t fitness-ai-${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}

  docker-build-web:
    name: "Docker: Build Web Image"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [backend-lint, backend-test, backend-security, secret-detection, dashboard-lint, dashboard-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Web image
        run: docker build -t fitness-ai-web:${{ github.sha }} ./web
