server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the Flutter bundle (main.dart.js is ~3.5 MB raw, ~1 MB gzipped)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/manifest+json image/svg+xml
               font/ttf font/otf application/octet-stream;

    # Flutter web file names are not content-hashed: always revalidate
    # (cheap 304 via ETag) so a deploy never mixes old and new files.
    add_header Cache-Control "no-cache" always;

    # Flutter web / SPA: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /flutter_service_worker.js { try_files $uri =404; }
}
