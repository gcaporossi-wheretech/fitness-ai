# Traefik v3 dynamic configuration — middlewares and TLS

http:
  middlewares:
    # Rate limiting — global
    rate-limit-global:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

    # Rate limiting — auth endpoints (stricter)
    rate-limit-auth:
      rateLimit:
        average: 5
        burst: 3
        period: 1m

    # Rate limiting — AI endpoints (expensive)
    rate-limit-ai:
      rateLimit:
        average: 10
        burst: 5
        period: 1h

    # Security headers
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"

    # CORS middleware
    cors:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://localhost:8080"
          - "https://fitnessai.app"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Correlation-Id
        accessControlMaxAge: 3600

    # Request size limit (10MB for photo uploads)
    body-limit:
      buffering:
        maxRequestBodyBytes: 10485760

    # HTTP to HTTPS redirect (used in production)
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

# TLS configuration for production
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
